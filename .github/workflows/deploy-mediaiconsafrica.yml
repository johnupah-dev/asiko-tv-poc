name: Deploy mediaiconsafrica.com

# Uploads site-mediaiconsafrica/ to the mediaiconsafrica.com cPanel document root.
# Uses the same repo secret as asiko.africa: CPANEL_TOKEN.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [site-mediaiconsafrica/**, deploy/mediaiconsafrica.com.htaccess, deploy/cpanel-deploy.sh]

concurrency:
  group: deploy-mediaiconsafrica
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload to cPanel
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
          CPANEL_USER: mediaic1
          CPANEL_HOST: ${{ vars.CPANEL_HOST || 'mediaiconsafrica.com' }}
          SITE_DOMAIN: mediaiconsafrica.com
          SRC_DIR: site-mediaiconsafrica
          HTACCESS: deploy/mediaiconsafrica.com.htaccess
          # keep the cPanel PHP directives (and anything else) already in the live .htaccess
          HTACCESS_MODE: prepend
          VERIFY_MARKER: 'name="site-build" content="mediaiconsafrica"'
          # never let this overwrite asiko.africa, which lives on the same cPanel account
          GUARD_DOMAINS: asiko.africa
        run: bash deploy/cpanel-deploy.sh
      - name: Keep the previous live files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previous-live-files
          path: backup/
          if-no-files-found: ignore
