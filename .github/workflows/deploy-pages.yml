name: Deploy asiko.africa (site-asiko-live) to GitHub Pages

# Mitigation for intermittent Hostinger origin 502s: this workflow publishes
# the static marketing site (site-asiko-live/) to GitHub Pages, a static host
# with no PHP/LSAPI backend to crash-loop. Once DNS for asiko.africa points
# here (see site-asiko-live/README.md), the site is no longer subject to
# Hostinger's shared-hosting resource limits.

on:
  push:
    branches: [master]
    paths:
      - "site-asiko-live/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-asiko-live
      - id: deployment
        uses: actions/deploy-pages@v4
