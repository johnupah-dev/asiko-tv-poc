name: On-air monitor

# Every 10 minutes: checks asiko.africa, the network feed, every channel's own
# feed and the Asiko Scheduler (ops/check-on-air.mjs).
# Something down -> opens (or updates) one issue labelled "on-air", so GitHub
# emails everyone watching the repo. All clear again -> comments and closes it.
# Set the repo variable SCHEDULER_URL once the scheduler is deployed.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: on-air-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check everything on air
        id: check
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.asiko.africa' }}
          SCHEDULER_URL: ${{ vars.SCHEDULER_URL }}
        run: node ops/check-on-air.mjs
      - name: Raise or clear the alert
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('ops/on-air-report.md', 'utf8');
            const down = process.env.OUTCOME !== 'success';
            const label = 'on-air';
            try { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a', description: 'Asiko TV on-air alert' }); } catch (e) {}
            const open = (await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: 'open', per_page: 1 })).data[0];
            if (down && !open) {
              await github.rest.issues.create({ ...context.repo, title: '🔴 Asiko TV on-air alert', labels: [label], body: report });
            } else if (down && open) {
              await github.rest.issues.update({ ...context.repo, issue_number: open.number, body: report });
            } else if (!down && open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.number, body: `Recovered.\n\n${report}` });
              await github.rest.issues.update({ ...context.repo, issue_number: open.number, state: 'closed' });
            }
            core.summary.addRaw(report).write();
