<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Asiko TV — Free African TV, Always On</title>
  <meta name="description" content="Watch Asiko TV free: 29 always-on African channels — Nollywood movies, faith, kids, food, lifestyle, business, sports, travel and live events. No subscription, no sign-up." />
  <meta name="theme-color" content="#0a0a0c" />
  <link rel="canonical" href="https://www.asiko.africa/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Asiko TV" />
  <meta property="og:title" content="Asiko TV — Free African TV, Always On" />
  <meta property="og:description" content="29 always-on African channels. Free to watch. No subscription, no sign-up." />
  <meta property="og:url" content="https://www.asiko.africa/" />
  <meta property="og:image" content="https://www.asiko.africa/assets/channels/asiko-plus.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="assets/asiko-icon.png" />
  <link rel="apple-touch-icon" href="assets/asiko-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="masthead">
      <a class="brand" href="./" aria-label="Asiko TV — home">
        <svg class="brand-mark" viewBox="0 0 32 32" role="img" aria-hidden="true">
          <path d="M16 3 L29 29 L3 29 Z" fill="#d8a94b" />
          <path d="M16 13 L23.5 27 L8.5 27 Z" fill="#0a0a0c" />
          <rect x="10" y="20.5" width="12" height="3.2" fill="#0a0a0c" />
        </svg>
        <span class="brand-text">
          <span class="brand-word">ASIKO<b>&nbsp;TV</b></span>
          <span class="brand-tag">The Soul of Africa</span>
        </span>
      </a>
      <div class="masthead-mid">
        <span class="on-air"><span class="rec"></span>ON AIR</span>
        <time id="clock" class="clock">00:00:00</time>
        <span id="tagline" class="tz">Free to watch</span>
      </div>
      <div class="masthead-actions">
        <button id="browseBtn" class="btn" type="button" aria-expanded="false">Channels</button>
        <button id="guideBtn" class="btn" type="button" aria-expanded="false">Guide</button>
        <button id="soundBtn" class="btn btn-accent" type="button">Unmute</button>
      </div>
    </header>

    <main class="stage">
      <video id="video" playsinline muted autoplay></video>
      <div class="scrim" aria-hidden="true"></div>

      <div id="bug" class="bug"><span class="bug-num">01</span><span class="bug-name">Asiko TV+</span></div>

      <div class="lower-third" id="lowerThird" aria-live="polite">
        <div class="lt-row lt-now">
          <span id="nowTag" class="lt-tag">NOW</span>
          <span id="nowTitle" class="lt-title">—</span>
          <span id="nowProgress" class="lt-prog"></span>
        </div>
        <div class="lt-row lt-next" id="nextRow">
          <span class="lt-tag lt-tag-ghost">NEXT</span>
          <span id="nextTitle" class="lt-title-next">—</span>
          <span id="nextTime" class="lt-time"></span>
        </div>
      </div>

      <div id="loading" class="loading" role="status">
        <img id="loadingLogo" class="loading-logo" alt="" hidden />
        <span id="loadingText">Tuning<span class="dots">…</span></span>
      </div>
    </main>

    <nav id="rail" class="rail" aria-label="Channels"></nav>

    <footer class="site-foot">
      <div class="foot-lede">
        <b>Asiko TV</b> — free African TV, always on. No subscription. No sign-up.
      </div>
      <nav class="foot-links" aria-label="Business">
        <a href="mailto:john.upah@mediaiconsltd.com?subject=Advertising%20on%20Asiko%20TV">Advertise</a>
        <a href="mailto:john.upah@mediaiconsltd.com?subject=List%20my%20channel%20on%20Asiko%20TV">List your channel</a>
        <a href="mailto:john.upah@mediaiconsltd.com?subject=Asiko%20TV">Contact</a>
      </nav>
      <div class="foot-legal">© <span id="year">2026</span> Media Icons Africa</div>
    </footer>
  </div>

  <div id="guide" class="guide" hidden>
    <div class="guide-head">
      <div class="guide-title">TV Guide</div>
      <div id="guideWindow" class="guide-window">—</div>
      <button id="guideClose" class="btn" type="button">Close</button>
    </div>
    <div id="guideGrid" class="guide-grid"></div>
  </div>

  <div id="browse" class="browse" hidden>
    <div class="browse-head">
      <span class="lockup-sm">ASIKO<b>&nbsp;TV</b></span>
      <span id="browseSub" class="browse-sub">All channels</span>
      <button id="browseClose" class="btn" type="button">Close</button>
    </div>
    <div id="browseBody" class="browse-body"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
